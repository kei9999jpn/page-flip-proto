<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>A案</title>
<link rel="preload" as="image" href="../assets/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
#bg{position:fixed;inset:0;background:url(../assets/bg.jpg) center/cover no-repeat;filter:brightness(.62)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 18%,rgba(0,0,0,.8) 100%)}
#book{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);box-shadow:0 18px 50px rgba(0,0,0,.75);border-radius:2px;touch-action:none;opacity:0;filter:blur(14px) brightness(2.1);transition:opacity 1.5s ease,transform 1.5s ease,filter 1.8s ease}
#book.in{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0) brightness(1)}
#fade{position:fixed;inset:0;background:#000;opacity:1;transition:opacity 1.6s ease;pointer-events:none;z-index:30}

/* ---- cover scene ---- */
#cover{position:fixed;inset:0;cursor:pointer;overflow:hidden;z-index:10;background:#000}
#coverImg{position:absolute;inset:-4%;background:url(../assets/cover.jpg) center/cover no-repeat;
  filter:brightness(.82);animation:kenburns 26s ease-in-out infinite alternate;
  transition:transform 2.1s cubic-bezier(.55,0,.85,.35),filter 2.1s ease}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
#coverVin{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 26%,rgba(0,0,0,.82) 100%);pointer-events:none}
#coverGlow{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,206,130,.12) 0%,transparent 62%);
  animation:pulse 3.8s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
#logoMark{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);width:min(26vw,150px);
  opacity:.15;pointer-events:none;z-index:2;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.10}50%{opacity:.20}}
#cover.zooming #coverImg{animation:none;transform:scale(2.5);filter:brightness(.05) blur(12px)}
#cover.zooming #coverGlow,#cover.zooming #logoMark{opacity:0;transition:opacity .8s ease}

/* ---- souls-like title ---- */
#title{position:fixed;left:0;right:0;top:38%;z-index:20;text-align:center;pointer-events:none;
  font-family:"Shippori Mincho",serif;color:#e9dfc8;opacity:0;filter:blur(14px);
  transition:opacity 1.5s ease,filter 1.5s ease}
#title .main{font-size:min(8.2vw,58px);font-weight:600;letter-spacing:.26em;text-indent:.26em;white-space:nowrap;
  text-shadow:0 0 22px rgba(233,215,170,.35),0 2px 12px rgba(0,0,0,.9)}
#title .rule{width:min(58vw,340px);height:1px;margin:14px auto;
  background:linear-gradient(90deg,transparent,rgba(233,223,200,.75),transparent)}
#title.show{opacity:1;filter:blur(0)}
#title.hide{opacity:0;filter:blur(10px);transition:opacity 1s ease,filter 1s ease}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity 1.2s ease}

/* ---- ambience overlays ---- */
#candle{position:fixed;inset:0;pointer-events:none;mix-blend-mode:soft-light;z-index:5;
  background:radial-gradient(ellipse 70% 55% at 50% 42%,rgba(255,180,95,.5),transparent 70%)}
#dust{position:fixed;inset:0;pointer-events:none;z-index:6}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="book"></canvas>
<div id="candle"></div>
<canvas id="dust"></canvas>
<div id="cover"><div id="coverImg"></div><div id="coverVin"></div><div id="coverGlow"></div><img id="logoMark" src="../assets/logo-mark.png" alt=""></div>
<div id="dim"></div>
<div id="title"><div class="rule"></div><div class="main">名言集 1000枚</div><div class="rule"></div></div>
<div id="fade"></div>
<audio id="bgm" loop preload="auto" src="../assets/bgm.mp3"></audio>
<audio id="rain" loop preload="auto" src="../assets/rain.mp3"></audio>
<script>
(() => {
const N = 5, SRC = i => '../assets/pages/p' + (i + 1) + '.jpg';
const cv = document.getElementById('book'), ctx = cv.getContext('2d');
let W, H, DPR, TRAVEL;
const EDGE = 8;
function layout() {
  const vw = innerWidth, vh = innerHeight;
  H = Math.min(vh * 0.78, vw * 0.92 * 4 / 3); W = H * 3 / 4;
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  TRAVEL = Math.max(180, Math.min(W * 1.05, vw * 0.72));
}
layout();
addEventListener('resize', () => { layout(); draw(); });

// ---- lazy image loading (cover shows instantly; pages arrive in the background) ----
const imgs = new Array(N); let backTex = null;
const loadImg = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
const pagesReady = Promise.all(Array.from({ length: N }, (_, i) => loadImg(SRC(i)).then(im => { imgs[i] = im; if (i === index) draw(); })));
loadImg('../assets/backside.jpg').then(im => { backTex = im; });

let index = 0, flip = null, anim = null;

// ---------- book-like peel geometry ----------
function peel(t, pw, ph) {
  const C = { x: pw, y: ph * 0.30 };
  const P1 = { x: pw * 0.05, y: ph * 0.62 }, P2 = { x: -pw * 1.7, y: ph * 0.22 };
  const u = 1 - t;
  const M = { x: u * u * C.x + 2 * t * u * P1.x + t * t * P2.x,
              y: u * u * C.y + 2 * t * u * P1.y + t * t * P2.y };
  let dx = M.x - C.x, dy = M.y - C.y;
  const len = Math.hypot(dx, dy) || 1;
  const n = { x: dx / len, y: dy / len };
  const mid = { x: (C.x + M.x) / 2, y: (C.y + M.y) / 2 };
  const k = mid.x * n.x + mid.y * n.y;
  return { n, k, mid, C, M };
}
const sd = (p, g) => p.x * g.n.x + p.y * g.n.y - g.k;
function clipPoly(poly, g, keepNeg) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = sd(a, g), db = sd(b, g);
    const ina = keepNeg ? da <= 0 : da >= 0, inb = keepNeg ? db <= 0 : db >= 0;
    if (ina) out.push(a);
    if (ina !== inb) {
      const f = da / (da - db);
      out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
    }
  }
  return out;
}
function pathPoly(poly) {
  ctx.beginPath();
  poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
}

// ---------- render ----------
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pw = W - EDGE, ph = H - EDGE;

  const remain = Math.max(0, N - 1 - index - (flip && flip.dir > 0 ? 1 : 0));
  for (let i = Math.min(3, remain); i >= 1; i--) {
    const o = i * 2.4;
    ctx.fillStyle = i % 2 ? '#cbbd9c' : '#bfb08d';
    ctx.fillRect(o, o, pw, ph);
    ctx.fillStyle = 'rgba(60,45,20,0.25)';
    ctx.fillRect(o, o + ph - 1, pw, 1); ctx.fillRect(o + pw - 1, o, 1, ph);
  }

  if (!imgs[index]) { ctx.fillStyle = '#1a140c'; ctx.fillRect(0, 0, pw, ph); return; }
  if (!flip) { ctx.drawImage(imgs[index], 0, 0, pw, ph); return; }
  const under = flip.dir > 0 ? imgs[index + 1] : imgs[index];
  const sheet = flip.dir > 0 ? imgs[index] : imgs[index - 1];
  if (!under || !sheet) { ctx.drawImage(imgs[index], 0, 0, pw, ph); return; }
  const t = Math.min(Math.max(flip.t, 0.004), 0.996);
  const g = peel(t, pw, ph);
  const rect = [{ x: 0, y: 0 }, { x: pw, y: 0 }, { x: pw, y: ph }, { x: 0, y: ph }];
  const frontPoly = clipPoly(rect, g, false);
  const foldPoly  = clipPoly(rect, g, true);

  ctx.drawImage(under, 0, 0, pw, ph);

  const so = 0.40 * Math.sin(Math.PI * t);
  if (so > 0.01 && foldPoly.length) {
    ctx.save(); pathPoly(foldPoly); ctx.clip();
    const sw = Math.min(64, pw * 0.28);
    const gr = ctx.createLinearGradient(g.mid.x, g.mid.y, g.mid.x - g.n.x * sw, g.mid.y - g.n.y * sw);
    gr.addColorStop(0, 'rgba(0,0,0,' + so.toFixed(3) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, pw, ph);
    ctx.restore();
  }

  if (frontPoly.length) {
    ctx.save(); pathPoly(frontPoly); ctx.clip();
    ctx.drawImage(sheet, 0, 0, pw, ph);
    const cw = Math.min(30, pw * 0.12);
    const gr = ctx.createLinearGradient(g.mid.x, g.mid.y, g.mid.x + g.n.x * cw, g.mid.y + g.n.y * cw);
    gr.addColorStop(0, 'rgba(0,0,0,0.28)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, pw, ph);
    ctx.restore();
  }

  if (foldPoly.length) {
    const a = 1 - 2 * g.n.x * g.n.x, b = -2 * g.n.x * g.n.y, d = 1 - 2 * g.n.y * g.n.y;
    const e = 2 * g.k * g.n.x, f = 2 * g.k * g.n.y;
    ctx.save();
    ctx.transform(a, b, b, d, e, f);
    pathPoly(foldPoly); ctx.clip();
    // paper backside: KEI's parchment texture, pulled well down into shadow
    if (backTex) {
      ctx.drawImage(backTex, 0, 0, pw, ph);
      ctx.fillStyle = 'rgba(24,16,7,0.42)'; ctx.fillRect(0, 0, pw, ph);
    } else {
      ctx.fillStyle = '#8a7554'; ctx.fillRect(0, 0, pw, ph);
    }
    const gr = ctx.createLinearGradient(g.mid.x, g.mid.y, g.mid.x + (g.C.x - g.mid.x), g.mid.y + (g.C.y - g.mid.y));
    gr.addColorStop(0, 'rgba(250,238,210,0.14)');
    gr.addColorStop(0.18, 'rgba(250,238,210,0.02)');
    gr.addColorStop(0.55, 'rgba(30,20,8,0.22)');
    gr.addColorStop(1, 'rgba(18,12,5,0.55)');
    ctx.fillStyle = gr; ctx.fillRect(-pw, -ph, pw * 3, ph * 3);
    ctx.restore();
    const flapScreen = foldPoly.map(p => ({ x: a * p.x + b * p.y + e, y: b * p.x + d * p.y + f }));
    ctx.save();
    pathPoly(flapScreen);
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 14;
    ctx.shadowOffsetX = -6 * Math.sin(Math.PI * t); ctx.shadowOffsetY = 5 * Math.sin(Math.PI * t);
    ctx.strokeStyle = 'rgba(40,30,12,0.35)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}
draw();

// ---------- audio ----------
let ac = null, flipBuf = null;
const bgm = document.getElementById('bgm'), rain = document.getElementById('rain');
function ensureAudio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if (ac) fetch('../assets/se/page1.mp3').then(r => r.arrayBuffer())
      .then(b => ac.decodeAudioData(b)).then(buf => { flipBuf = buf; }).catch(() => {});
  }
  if (bgm.paused) { bgm.volume = 0.22; bgm.play().catch(() => {}); }
  if (rain.paused) { rain.volume = 0.16; rain.play().catch(() => {}); }
}
function pageSound(strength) {
  if (!ac || !flipBuf) return;
  const src = ac.createBufferSource(); src.buffer = flipBuf;
  src.playbackRate.value = 0.94 + Math.random() * 0.14;   // slight variation each turn
  const g = ac.createGain(); g.gain.value = 0.75 * Math.min(1, strength + 0.35);
  src.connect(g); g.connect(ac.destination); src.start();
}
function thump() {
  if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(96, t0); o.frequency.exponentialRampToValueAtTime(38, t0 + 0.28);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + 0.5);
  const dur = 0.18, buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = ac.createBufferSource(); src.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
  const g2 = ac.createGain(); g2.gain.value = 0.5;
  src.connect(lp); lp.connect(g2); g2.connect(ac.destination); src.start(t0);
}

// ---------- flip control ----------
function beginFlip(dir) {
  if (dir > 0 && index >= N - 1) return false;
  if (dir < 0 && index <= 0) return false;
  if (!imgs[index + (dir > 0 ? 1 : -1)]) return false;
  flip = { dir, t: dir > 0 ? 0 : 1 };
  return true;
}
function finishFlip(commitTo, withSound) {
  const from = flip.t, dir = flip.dir;
  const dur = 90 + 340 * Math.abs(commitTo - from);
  const t0 = performance.now();
  if (withSound && Math.abs(commitTo - from) > 0.05) pageSound(Math.abs(commitTo - from));
  anim = {};
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    flip.t = from + (commitTo - from) * e;
    draw();
    if (k < 1) { anim.raf = requestAnimationFrame(step); }
    else {
      if (dir > 0 && commitTo === 1) index++;
      if (dir < 0 && commitTo === 0) index--;
      flip = null; anim = null; draw();
    }
  })(t0);
}

// ---------- input ----------
let pd = null, hist = [];
cv.addEventListener('pointerdown', e => {
  if (anim) return;
  ensureAudio();
  pd = { x0: e.clientX, x: e.clientX, t0: performance.now(), started: false, tBase: 0 };
  hist = [[e.clientX, performance.now()]];
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!pd) return;
  pd.x = e.clientX;
  hist.push([e.clientX, performance.now()]);
  while (hist.length > 2 && performance.now() - hist[0][1] > 90) hist.shift();
  if (!pd.started) {
    const dx = pd.x - pd.x0;
    if (Math.abs(dx) < 5) return;
    const dir = dx < 0 ? +1 : -1;
    if (!beginFlip(dir)) { pd = null; return; }
    pd.started = true; pd.tBase = flip.t;
  }
  flip.t = Math.max(0, Math.min(1, pd.tBase + (pd.x0 - pd.x) / TRAVEL));
  draw();
});
function release(e) {
  if (!pd) return;
  const dt = performance.now() - pd.t0, dx = pd.x - pd.x0;
  if (!pd.started) {
    if (dt < 300 && Math.abs(dx) < 8) {
      const dir = pd.x0 > innerWidth / 2 ? +1 : -1;
      if (beginFlip(dir)) finishFlip(dir > 0 ? 1 : 0, true);
    }
    pd = null; return;
  }
  let vx = 0;
  if (hist.length >= 2) {
    const a = hist[0], b = hist[hist.length - 1];
    if (b[1] > a[1]) vx = (b[0] - a[0]) / (b[1] - a[1]);
  }
  let commitTo;
  if (flip.dir > 0) commitTo = (flip.t > 0.4 || vx < -0.4) ? 1 : 0;
  else              commitTo = (flip.t < 0.6 || vx > 0.4) ? 0 : 1;
  finishFlip(commitTo, true);
  pd = null;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { if (pd && pd.started && flip) finishFlip(flip.dir > 0 ? 0 : 1, false); pd = null; });

// ---------- dust motes ----------
const dc = document.getElementById('dust'), dctx = dc.getContext('2d');
let motes = [];
function dustLayout() {
  dc.width = innerWidth; dc.height = innerHeight;
  const n = Math.round(innerWidth * innerHeight / 26000);
  motes = Array.from({ length: n }, () => ({
    x: Math.random() * dc.width, y: Math.random() * dc.height,
    r: 0.6 + Math.random() * 1.6, a: 0.03 + Math.random() * 0.10,
    vx: (Math.random() - 0.5) * 0.12, vy: -(0.05 + Math.random() * 0.16),
    ph: Math.random() * Math.PI * 2
  }));
}
dustLayout(); addEventListener('resize', dustLayout);
(function dustStep(ts) {
  dctx.clearRect(0, 0, dc.width, dc.height);
  for (const m of motes) {
    m.x += m.vx + Math.sin(ts / 2400 + m.ph) * 0.06; m.y += m.vy;
    if (m.y < -4) { m.y = dc.height + 4; m.x = Math.random() * dc.width; }
    if (m.x < -4) m.x = dc.width + 4; if (m.x > dc.width + 4) m.x = -4;
    const tw = 0.6 + 0.4 * Math.sin(ts / 900 + m.ph * 3);
    dctx.fillStyle = 'rgba(255,226,170,' + (m.a * tw).toFixed(3) + ')';
    dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); dctx.fill();
  }
  requestAnimationFrame(dustStep);
})(0);

// ---------- candle flicker ----------
const candle = document.getElementById('candle');
(function flicker() {
  candle.style.opacity = (0.75 + Math.random() * 0.25).toFixed(3);
  setTimeout(flicker, 90 + Math.random() * 240);
})();

// ---------- opening sequence: tap -> souls title -> zoom into the book -> pages ----------
const cover = document.getElementById('cover');
const title = document.getElementById('title');
const dim = document.getElementById('dim');
let opening = false;
requestAnimationFrame(() => { document.getElementById('fade').style.opacity = '0'; });
cover.addEventListener('pointerup', () => {
  if (opening) return; opening = true;
  ensureAudio(); thump();
  dim.style.opacity = '0.45';                            // the room sinks darker
  setTimeout(() => { title.classList.add('show'); }, 500);      // 名言集 1000枚 ボワーン
  setTimeout(() => { title.classList.add('hide'); }, 2600);     // and it dissolves
  setTimeout(() => {                                            // dive into the book
    cover.classList.add('zooming');
    dim.style.opacity = '1';
  }, 3300);
  setTimeout(() => {                                            // black instant, then the page world blooms in
    cover.remove(); title.remove();
    dim.style.opacity = '0';
    pagesReady.then(() => { draw(); });
    cv.classList.add('in');
  }, 5200);
});
})();
</script>
</body>
</html>
