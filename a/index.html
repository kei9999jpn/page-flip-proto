<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>A案</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d0a07;overscroll-behavior:none}
#bg{position:fixed;inset:0;background:url(../assets/bg.jpg) center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.6) 100%)}
#book{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);box-shadow:0 18px 50px rgba(0,0,0,.65);border-radius:2px;touch-action:none;opacity:0;transition:opacity 1.2s ease,transform 1.2s ease}
#book.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fade{position:fixed;inset:0;background:#000;opacity:1;transition:opacity 1.6s ease;pointer-events:none}

/* ---- cover scene ---- */
#cover{position:fixed;inset:0;cursor:pointer;overflow:hidden}
#coverImg{position:absolute;inset:-4%;background:url(../assets/cover.jpg) center/cover no-repeat;
  animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
#cover::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.72) 100%)}
#coverGlow{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,214,140,.14) 0%,transparent 62%);
  animation:pulse 3.6s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#logoMark{position:absolute;left:50%;bottom:6.5vh;transform:translateX(-50%);width:min(46vw,300px);
  opacity:.16;pointer-events:none;z-index:2;filter:drop-shadow(0 0 14px rgba(255,230,180,.25));
  animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.12}50%{opacity:.22}}
#cover.opening #coverImg{animation:none;transition:transform 1.5s cubic-bezier(.5,0,.8,.4);transform:scale(1.85)}
#cover.opening{transition:opacity 1.4s ease .35s;opacity:0}

/* ---- ambience overlays ---- */
#candle{position:fixed;inset:0;pointer-events:none;mix-blend-mode:soft-light;z-index:5;
  background:radial-gradient(ellipse 70% 55% at 50% 42%,rgba(255,190,110,.55),transparent 70%)}
#dust{position:fixed;inset:0;pointer-events:none;z-index:6}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="book"></canvas>
<div id="candle"></div>
<canvas id="dust"></canvas>
<div id="cover"><div id="coverImg"></div><div id="coverGlow"></div><img id="logoMark" src="../assets/logo-white.png" alt=""></div>
<div id="fade"></div>
<audio id="bgm" loop preload="auto" src="../assets/bgm.mp3"></audio>
<script>
(async () => {
const N = 5, SRC = i => '../assets/pages/p' + (i + 1) + '.jpg';
const cv = document.getElementById('book'), ctx = cv.getContext('2d');
let W, H, DPR, TRAVEL;
const EDGE = 8;                       // room for the page-stack edges
function layout() {
  const vw = innerWidth, vh = innerHeight;
  H = Math.min(vh * 0.78, vw * 0.92 * 4 / 3); W = H * 3 / 4;
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  TRAVEL = Math.max(180, Math.min(W * 1.05, vw * 0.72));
}
layout();
addEventListener('resize', () => { layout(); draw(); });

const imgs = await Promise.all(Array.from({ length: N }, (_, i) => new Promise((res, rej) => {
  const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = SRC(i);
})));

let index = 0, flip = null, anim = null;

// ---------- corner-peel geometry ----------
// The sheet is grabbed at its top-right corner C and dragged to M(t).
// Fold line = perpendicular bisector of C..M. The part of the sheet on the
// C-side of the line is folded over (drawn reflected, parchment backside).
function peel(t, pw, ph) {
  // grab the sheet at the right edge, about 3/10 from the top — the fold stays
  // near-vertical so the whole page turns at once (book-like), with a light diagonal
  const C = { x: pw, y: ph * 0.30 };
  const P1 = { x: pw * 0.05, y: ph * 0.62 }, P2 = { x: -pw * 1.7, y: ph * 0.22 };
  const u = 1 - t;
  const M = { x: u * u * C.x + 2 * t * u * P1.x + t * t * P2.x,
              y: u * u * C.y + 2 * t * u * P1.y + t * t * P2.y };
  let dx = M.x - C.x, dy = M.y - C.y;
  const len = Math.hypot(dx, dy) || 1;
  const n = { x: dx / len, y: dy / len };               // unit normal of fold line (points C->M)
  const mid = { x: (C.x + M.x) / 2, y: (C.y + M.y) / 2 };
  const k = mid.x * n.x + mid.y * n.y;                  // line: p·n = k ; C-side has p·n > k? C·n-k = -len/2 <0 → C-side: p·n < k
  return { n, k, mid, C, M };
}
const sd = (p, g) => p.x * g.n.x + p.y * g.n.y - g.k;   // signed distance*|n| ; C-side < 0
function clipPoly(poly, g, keepNeg) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = sd(a, g), db = sd(b, g);
    const ina = keepNeg ? da <= 0 : da >= 0, inb = keepNeg ? db <= 0 : db >= 0;
    if (ina) out.push(a);
    if (ina !== inb) {
      const f = da / (da - db);
      out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
    }
  }
  return out;
}
function pathPoly(poly) {
  ctx.beginPath();
  poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
}

// ---------- render ----------
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pw = W - EDGE, ph = H - EDGE;

  // page-stack edges (remaining pages, bottom-right)
  const remain = Math.max(0, N - 1 - index - (flip && flip.dir > 0 ? 1 : 0));
  for (let i = Math.min(3, remain); i >= 1; i--) {
    const o = i * 2.4;
    ctx.fillStyle = i % 2 ? '#cbbd9c' : '#bfb08d';
    ctx.fillRect(o, o, pw, ph);
    ctx.fillStyle = 'rgba(60,45,20,0.25)';
    ctx.fillRect(o, o + ph - 1, pw, 1); ctx.fillRect(o + pw - 1, o, 1, ph);
  }

  if (!flip) { ctx.drawImage(imgs[index], 0, 0, pw, ph); return; }
  const under = flip.dir > 0 ? imgs[index + 1] : imgs[index];
  const sheet = flip.dir > 0 ? imgs[index] : imgs[index - 1];
  const t = Math.min(Math.max(flip.t, 0.004), 0.996);   // avoid degenerate fold at the exact ends
  const g = peel(t, pw, ph);
  const rect = [{ x: 0, y: 0 }, { x: pw, y: 0 }, { x: pw, y: ph }, { x: 0, y: ph }];
  const frontPoly = clipPoly(rect, g, false);   // still-flat part of the sheet
  const foldPoly  = clipPoly(rect, g, true);    // part being folded over (original coords)

  // under page
  ctx.drawImage(under, 0, 0, pw, ph);

  // shadow on the revealed under page, along the fold (on the C-side, where the sheet lifted away)
  const so = 0.40 * Math.sin(Math.PI * t);
  if (so > 0.01 && foldPoly.length) {
    ctx.save(); pathPoly(foldPoly); ctx.clip();
    const sw = Math.min(64, pw * 0.28);
    const gr = ctx.createLinearGradient(g.mid.x, g.mid.y, g.mid.x - g.n.x * sw, g.mid.y - g.n.y * sw);
    gr.addColorStop(0, 'rgba(0,0,0,' + so.toFixed(3) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillRect(0, 0, pw, ph);
    ctx.restore();
  }

  // sheet front (not yet folded)
  if (frontPoly.length) {
    ctx.save(); pathPoly(frontPoly); ctx.clip();
    ctx.drawImage(sheet, 0, 0, pw, ph);
    // crease shading just before the fold line
    const cw = Math.min(30, pw * 0.12);
    const gr = ctx.createLinearGradient(g.mid.x, g.mid.y, g.mid.x - g.n.x * -cw, g.mid.y - g.n.y * -cw);
    gr.addColorStop(0, 'rgba(0,0,0,0.28)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, pw, ph);
    ctx.restore();
  }

  // flap: folded-over part, reflected across the fold line, plain parchment backside
  if (foldPoly.length) {
    const a = 1 - 2 * g.n.x * g.n.x, b = -2 * g.n.x * g.n.y, d = 1 - 2 * g.n.y * g.n.y;
    const e = 2 * g.k * g.n.x, f = 2 * g.k * g.n.y;
    ctx.save();
    ctx.transform(a, b, b, d, e, f);          // reflection (within current DPR transform)
    pathPoly(foldPoly); ctx.clip();
    ctx.fillStyle = '#c3ab84'; ctx.fillRect(-pw, -ph, pw * 3, ph * 3);
    // curl shading: faint crease light at fold, sinking into warm shadow toward the lifted edge
    const gr = ctx.createLinearGradient(g.mid.x, g.mid.y, g.mid.x + (g.C.x - g.mid.x), g.mid.y + (g.C.y - g.mid.y));
    gr.addColorStop(0, 'rgba(250,238,210,0.20)');
    gr.addColorStop(0.15, 'rgba(250,238,210,0.03)');
    gr.addColorStop(0.5, 'rgba(64,46,22,0.16)');
    gr.addColorStop(1, 'rgba(48,34,16,0.42)');
    ctx.fillStyle = gr; ctx.fillRect(-pw, -ph, pw * 3, ph * 3);
    ctx.restore();
    // flap outline: soft edge + drop shadow of the flap onto everything beneath
    const flapScreen = foldPoly.map(p => ({
      x: a * p.x + b * p.y + e, y: b * p.x + d * p.y + f
    }));
    ctx.save();
    pathPoly(flapScreen);
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 14;
    ctx.shadowOffsetX = -6 * Math.sin(Math.PI * t); ctx.shadowOffsetY = 5 * Math.sin(Math.PI * t);
    ctx.strokeStyle = 'rgba(40,30,12,0.35)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}
draw();

// ---------- audio ----------
let ac = null, ambientOn = false; const bgm = document.getElementById('bgm');
function ensureAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (bgm.paused) {
    bgm.volume = 0.32;
    bgm.play().then(() => {}).catch(() => { startAmbient(); });
    if (bgm.error || bgm.readyState === 0) startAmbient();
  }
}
// placeholder room tone until assets/bgm.mp3 exists: soft filtered noise, barely there
function startAmbient() {
  if (!ac || ambientOn) return; ambientOn = true;
  const sr = ac.sampleRate, len = sr * 4;
  const buf = ac.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.4;
  const g = ac.createGain(); g.gain.value = 0.05;
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
  const lfoG = ac.createGain(); lfoG.gain.value = 0.02;
  lfo.connect(lfoG); lfoG.connect(g.gain);
  src.connect(lp); lp.connect(g); g.connect(ac.destination);
  src.start(); lfo.start();
}
function swish(strength) {
  if (!ac) return;
  const t0 = ac.currentTime, sr = ac.sampleRate;
  // body: airy sweep of the sheet moving
  const dur = 0.30;
  const buf = ac.createBuffer(1, sr * dur, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1);
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.6;
  bp.frequency.setValueAtTime(600, t0);
  bp.frequency.exponentialRampToValueAtTime(2400, t0 + dur * 0.7);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.30 * strength, t0 + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t0);
  // crisp paper "flick" as the page settles
  const fd = 0.07;
  const fb = ac.createBuffer(1, sr * fd, sr);
  const fdd = fb.getChannelData(0);
  for (let i = 0; i < fdd.length; i++) fdd[i] = (Math.random() * 2 - 1) * (1 - i / fdd.length);
  const fsrc = ac.createBufferSource(); fsrc.buffer = fb;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2800;
  const fg = ac.createGain(); fg.gain.value = 0.22 * strength;
  fsrc.connect(hp); hp.connect(fg); fg.connect(ac.destination);
  fsrc.start(t0 + dur * 0.55);
}
function thump() {
  if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(96, t0); o.frequency.exponentialRampToValueAtTime(38, t0 + 0.28);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + 0.5);
  const dur = 0.18, buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = ac.createBufferSource(); src.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
  const g2 = ac.createGain(); g2.gain.value = 0.5;
  src.connect(lp); lp.connect(g2); g2.connect(ac.destination); src.start(t0);
}

// ---------- flip control ----------
function beginFlip(dir) {
  if (dir > 0 && index >= N - 1) return false;
  if (dir < 0 && index <= 0) return false;
  flip = { dir, t: dir > 0 ? 0 : 1 };
  return true;
}
function finishFlip(commitTo, withSound) {
  const from = flip.t, dir = flip.dir;
  const dur = 90 + 340 * Math.abs(commitTo - from);
  const t0 = performance.now();
  if (withSound && Math.abs(commitTo - from) > 0.05) swish(1);
  anim = {};
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    flip.t = from + (commitTo - from) * e;
    draw();
    if (k < 1) { anim.raf = requestAnimationFrame(step); }
    else {
      if (dir > 0 && commitTo === 1) index++;
      if (dir < 0 && commitTo === 0) index--;
      flip = null; anim = null; draw();
    }
  })(t0);
}

// ---------- input ----------
let pd = null, hist = [];
cv.addEventListener('pointerdown', e => {
  if (anim) return;
  ensureAudio();
  pd = { x0: e.clientX, x: e.clientX, t0: performance.now(), started: false, tBase: 0 };
  hist = [[e.clientX, performance.now()]];
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!pd) return;
  pd.x = e.clientX;
  hist.push([e.clientX, performance.now()]);
  while (hist.length > 2 && performance.now() - hist[0][1] > 90) hist.shift();
  if (!pd.started) {
    const dx = pd.x - pd.x0;
    if (Math.abs(dx) < 5) return;
    const dir = dx < 0 ? +1 : -1;
    if (!beginFlip(dir)) { pd = null; return; }
    pd.started = true; pd.tBase = flip.t;
  }
  flip.t = Math.max(0, Math.min(1, pd.tBase + (pd.x0 - pd.x) / TRAVEL));
  draw();
});
function release(e) {
  if (!pd) return;
  const dt = performance.now() - pd.t0, dx = pd.x - pd.x0;
  if (!pd.started) {
    if (dt < 300 && Math.abs(dx) < 8) {
      const dir = pd.x0 > innerWidth / 2 ? +1 : -1;
      if (beginFlip(dir)) finishFlip(dir > 0 ? 1 : 0, true);
    }
    pd = null; return;
  }
  let vx = 0;
  if (hist.length >= 2) {
    const a = hist[0], b = hist[hist.length - 1];
    if (b[1] > a[1]) vx = (b[0] - a[0]) / (b[1] - a[1]);
  }
  let commitTo;
  if (flip.dir > 0) commitTo = (flip.t > 0.4 || vx < -0.4) ? 1 : 0;
  else              commitTo = (flip.t < 0.6 || vx > 0.4) ? 0 : 1;
  finishFlip(commitTo, true);
  pd = null;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { if (pd && pd.started && flip) finishFlip(flip.dir > 0 ? 0 : 1, false); pd = null; });

// ---------- dust motes ----------
const dc = document.getElementById('dust'), dctx = dc.getContext('2d');
let motes = [];
function dustLayout() {
  dc.width = innerWidth; dc.height = innerHeight;
  const n = Math.round(innerWidth * innerHeight / 26000);
  motes = Array.from({ length: n }, () => ({
    x: Math.random() * dc.width, y: Math.random() * dc.height,
    r: 0.6 + Math.random() * 1.6, a: 0.03 + Math.random() * 0.10,
    vx: (Math.random() - 0.5) * 0.12, vy: -(0.05 + Math.random() * 0.16),
    ph: Math.random() * Math.PI * 2
  }));
}
dustLayout(); addEventListener('resize', dustLayout);
(function dustStep(ts) {
  dctx.clearRect(0, 0, dc.width, dc.height);
  for (const m of motes) {
    m.x += m.vx + Math.sin(ts / 2400 + m.ph) * 0.06; m.y += m.vy;
    if (m.y < -4) { m.y = dc.height + 4; m.x = Math.random() * dc.width; }
    if (m.x < -4) m.x = dc.width + 4; if (m.x > dc.width + 4) m.x = -4;
    const tw = 0.6 + 0.4 * Math.sin(ts / 900 + m.ph * 3);
    dctx.fillStyle = 'rgba(255,226,170,' + (m.a * tw).toFixed(3) + ')';
    dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); dctx.fill();
  }
  requestAnimationFrame(dustStep);
})(0);

// ---------- candle flicker ----------
const candle = document.getElementById('candle');
(function flicker() {
  candle.style.opacity = (0.75 + Math.random() * 0.25).toFixed(3);
  setTimeout(flicker, 90 + Math.random() * 240);
})();

// ---------- cover -> book entry ----------
const cover = document.getElementById('cover');
requestAnimationFrame(() => { document.getElementById('fade').style.opacity = '0'; });
cover.addEventListener('pointerup', () => {
  if (cover.classList.contains('opening')) return;
  ensureAudio(); thump();
  cover.classList.add('opening');
  setTimeout(() => { cv.classList.add('in'); }, 650);
  setTimeout(() => { cover.remove(); }, 1900);
}, { once: false });
})();
</script>
</body>
</html>
