<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>A案</title>
<link rel="preload" as="image" href="../assets/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;overflow:hidden;background:#000;overscroll-behavior:none;height:100%;height:-webkit-fill-available;height:100dvh}
#bg{position:fixed;inset:0;background:url(../assets/hall-bg.jpg) center 45%/cover no-repeat;filter:brightness(.95) saturate(1)}   /* v17 KEI: 読書中は別の書斎(暖炉の間)を明るめに */   /* 2026-09-04: 読書中も書斎(貴族版)を見せる */
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.55) 100%)}
#bg{z-index:0}
/* v16: 栞の紐(本の裏=ページの間を通る。上から入って下から出る) */
#ribbon{position:fixed;z-index:1;width:30px;pointer-events:none;opacity:0;transition:top 1.15s cubic-bezier(.4,0,.2,1),opacity .6s ease;
  /* 赤い古紙の栞: 少し褪せた朱、紙の繊維、縁の擦れ */
  background:
    repeating-linear-gradient(112deg,rgba(255,235,210,.07) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(28deg,rgba(0,0,0,.06) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,#8f2a22,#a83a2e 30%,#9a3127 60%,#7c231c);
  border-radius:2px 2px 0 0;box-shadow:0 3px 8px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,210,170,.14),inset 0 0 12px rgba(60,10,6,.55);transform-origin:50% 100%}
#ribbon.show{opacity:1}
#ribbon.sway{animation:ribbonSway 6s ease-in-out infinite alternate}
@keyframes ribbonSway{from{transform:rotate(-.4deg)}to{transform:rotate(.4deg)}}
/* 紐: 栞の上端の穴から出て、上へ小さな輪 */
#ribbon::before{content:"";position:absolute;left:50%;top:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#2a1008;box-shadow:inset 0 0 0 1px rgba(255,220,180,.25)}
#ribbon::after{content:"";position:absolute;left:50%;top:-22px;width:14px;height:26px;margin-left:-7px;border:2px solid #4a2a16;border-bottom:none;border-radius:8px 8px 0 0;box-shadow:0 1px 2px rgba(0,0,0,.6)}
/* v16: 読んでいる間はUIを闇へ溶かす(2.5秒操作なし)。画面の下側に触れれば戻る */
body.uihide #favBtn,body.uihide #favListBtn,body.uihide #setBtn,body.uihide #seen,body.uihide #backBtn{opacity:0 !important;transition:opacity 1.6s ease}
#book{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.97);z-index:2;box-shadow:0 30px 60px rgba(0,0,0,.85),0 2px 0 rgba(0,0,0,.6),0 0 0 1px rgba(60,44,22,.6);border-radius:2px;touch-action:none;opacity:0;filter:blur(14px) brightness(2.1);transition:opacity 1.5s ease,transform 1.5s ease,filter 1.8s ease}
#book.in{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0) brightness(1)}
#book.sway{top:46%}
/* v16: 本を閉じる時、ページの世界がゆっくり闇に沈む */
#book.out{opacity:0 !important;transform:translate(-50%,-49%) scale(.94) !important;filter:blur(5px) brightness(.35) !important;animation:none !important;
  transition:opacity 1.4s cubic-bezier(.6,0,.9,.6),transform 1.4s cubic-bezier(.6,0,.9,.6),filter 1.4s cubic-bezier(.6,0,.9,.6) !important}
#fade{position:fixed;inset:0;background:#000;opacity:1;transition:opacity 1.6s ease;pointer-events:none;z-index:30}

/* ---- cover scene ---- */
#cover{position:fixed;inset:0;cursor:pointer;overflow:hidden;z-index:10;background:#000}
#coverImg{position:absolute;inset:-4%;background:url(../assets/cover.jpg) center/cover no-repeat;will-change:transform;
  filter:brightness(.82);animation:kenburns 26s ease-in-out infinite alternate;
  transition:transform 3s cubic-bezier(.5,0,.85,.4),filter 3s cubic-bezier(.6,0,.9,.5)}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
#coverVin{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 26%,rgba(0,0,0,.82) 100%);pointer-events:none}
#coverGlow{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,206,130,.12) 0%,transparent 62%);
  animation:pulse 3.8s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
#logoMark{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);width:min(26vw,150px);
  opacity:.15;pointer-events:none;z-index:2;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.10}50%{opacity:.20}}
#cover.zooming #coverGlow,#cover.zooming #logoMark{opacity:0;transition:opacity .8s ease}
#book.sway{animation:swayK 9s ease-in-out infinite alternate}
@keyframes swayK{from{transform:translate(-50%,-50%) scale(1) rotate(-.35deg)}to{transform:translate(-50%,-50.4%) scale(1.004) rotate(.35deg)}}
#paperGlow{position:fixed;left:50%;top:54%;width:130vmin;height:110vmin;transform:translate(-50%,-50%);pointer-events:none;
  mix-blend-mode:overlay;z-index:4;opacity:0;transition:opacity 1.2s ease,transform 1.6s ease;
  background:radial-gradient(ellipse 46% 40% at 50% 52%,rgba(255,196,110,.85),rgba(255,170,80,.25) 55%,transparent 75%)}

/* ---- souls-like title ---- */
#title{position:fixed;left:0;right:0;top:38%;z-index:20;text-align:center;pointer-events:none;
  font-family:"Shippori Mincho",serif;color:#e9dfc8;opacity:0;filter:blur(14px);
  transition:opacity 1.5s ease,filter 1.5s ease}
#title .main{font-size:min(8.2vw,58px);font-weight:600;letter-spacing:.26em;text-indent:.26em;white-space:nowrap;
  text-shadow:0 0 22px rgba(233,215,170,.35),0 2px 12px rgba(0,0,0,.9)}
#title .rule{width:min(58vw,340px);height:1px;margin:14px auto;
  background:linear-gradient(90deg,transparent,rgba(233,223,200,.75),transparent)}
#title.show{opacity:1;filter:blur(0)}
#title.hide{opacity:0;filter:blur(10px);transition:opacity 1s ease,filter 1s ease}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity 1.2s ease}

/* ---- ambience overlays ---- */
/* ろうそくの暖色オーバーレイ(KEIお気に入りの雰囲気)。Claude in Chromeのスクショでは暗く写るが実機は正常 */
#candle{display:none;position:fixed;inset:0;pointer-events:none;mix-blend-mode:overlay;z-index:5;
  background:radial-gradient(ellipse 72% 58% at 50% 42%,rgba(255,176,88,.85),rgba(255,140,60,.25) 55%,transparent 75%)}
/* 蝋燭の影: 縁が暗く、灯りの位置が揺れて影が動く */
#shade{position:fixed;inset:-12%;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse 70% 62% at 56% 50%,transparent 44%,rgba(0,0,0,.20) 74%,rgba(0,0,0,.50) 100%);   /* v17: 書斎が見えるよう縁の闇をさらに弱める */
  transition:none}
#dust{position:fixed;inset:0;pointer-events:none;z-index:26}
/* 手前のろうそく(2026-09-02 KEI: 灯りで読んでいる感を見せる) */
#flameWrap{display:none;position:fixed;right:9%;bottom:6%;width:22px;height:120px;pointer-events:none;z-index:27;transform-origin:50% 100%}
#wick{position:absolute;left:50%;bottom:0;width:4px;height:14px;margin-left:-2px;background:linear-gradient(#1a120a,#3a2a18);border-radius:2px}
#flame{position:absolute;left:50%;bottom:10px;width:22px;height:54px;margin-left:-11px;transform-origin:50% 100%;
  border-radius:50% 50% 45% 45% / 70% 70% 30% 30%;
  background:radial-gradient(ellipse at 50% 80%,#fff8dc 0%,#ffd16a 25%,#ff8a1e 55%,rgba(255,80,0,.55) 78%,transparent 100%);
  filter:blur(.6px);box-shadow:0 0 18px 6px rgba(255,150,60,.55),0 0 60px 22px rgba(255,120,40,.28)}
#flameCore{position:absolute;left:50%;bottom:12px;width:8px;height:20px;margin-left:-4px;border-radius:50%;background:radial-gradient(#5aa8ff55,transparent 70%)}
/* v23: 右下の皿ロウソク(ChatGPT生成の絵・黒背景を screen 合成で抜く)。画像が無ければ非表示 */
#candleImg{position:fixed;right:calc(env(safe-area-inset-right,0px) - 3vw);bottom:calc(env(safe-area-inset-bottom,0px) - 1.5vh);width:min(34vmin,200px);pointer-events:none;z-index:8;mix-blend-mode:screen;opacity:0;transition:opacity 2s ease}
#candleImg.on{opacity:.95}
#flameGlow{position:fixed;pointer-events:none;z-index:9;width:22vmin;height:22vmin;margin:-11vmin 0 0 -11vmin;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(circle at 50% 55%,rgba(255,232,170,.95) 0%,rgba(255,180,90,.55) 18%,rgba(255,130,50,.18) 42%,transparent 66%);filter:blur(1.5px)}
#halo{position:fixed;right:0;bottom:0;width:120vmin;height:120vmin;pointer-events:none;z-index:7;mix-blend-mode:screen;
  transform:translate(35%,40%);background:radial-gradient(circle at 50% 50%,rgba(255,170,80,.42),rgba(255,120,40,.12) 35%,transparent 62%)}
#veil{position:fixed;inset:0;pointer-events:none;z-index:23;background:#000;opacity:0}
#cover{perspective:900px}
/* 目覚めのまばたき: 上下のまぶた */
#lidT,#lidB{position:fixed;left:-4%;right:-4%;background:#000;z-index:28;pointer-events:none;
  transform:translateY(0);transition:transform .26s cubic-bezier(.5,.1,.5,.9)}
#lidT{top:-2%;height:56%;border-radius:0 0 50% 50% / 0 0 10vh 10vh}
#lidB{bottom:-2%;height:56%;border-radius:50% 50% 0 0 / 10vh 10vh 0 0}
#lidT.open{transform:translateY(-106%)}
#lidB.open{transform:translateY(106%)}
#lidT.hidden,#lidB.hidden{display:none}

/* ---- favorites ---- */
/* 2026-09-03 KEI: ハートはダサい→文字ボタン「お気に入りに登録」。栞ボタンは廃止(お気に入りの本は入口の「お気に入りを見る」から) */
#favBtn,#favListBtn,#setBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2vh);bottom:calc(env(safe-area-inset-bottom,0px) + 1.2dvh);z-index:27;width:104px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:clamp(11px,3.1vmin,13px);letter-spacing:.2em;text-indent:.2em;
  color:#b8a98a;background:url(../assets/ui2/small.png) center/100% 100% no-repeat;border:none;height:80px;padding:0;cursor:pointer;user-select:none;opacity:0;transition:opacity 1s,color .18s;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
#favBtn b,#favListBtn b,#setBtn b{display:block;font-family:serif;font-size:clamp(15px,4vmin,17px);letter-spacing:0;text-indent:0;margin-bottom:3px;color:#c9a24a;font-weight:normal;height:18px;line-height:18px}
#favListBtn b svg,#setBtn b svg{vertical-align:top}
#favListBtn{left:calc(50% - 160px)}
#setBtn{left:calc(50% - 52px);display:none}
#setBtn.show{display:flex}
#favBtn{left:calc(50% + 56px)}
#favBtn.show,#favListBtn.show,#setBtn.show{opacity:.92;pointer-events:auto}
/* 見た枚数(右上)・戻る(左上): 同じ言語 */
#seen{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);z-index:27;color:#b8a98a;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:clamp(11px,3.1vmin,13px);letter-spacing:.18em;opacity:0;transition:opacity 1s;pointer-events:none;text-shadow:0 1px 3px #000}
#seen.show{opacity:.85}
#seen b{font-weight:normal;font-family:serif;font-size:18px;letter-spacing:.05em;margin-right:.25em;color:#c9a24a}
#backBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 14px);z-index:27;display:none;color:#b8a98a;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:clamp(11px,3.1vmin,13px);letter-spacing:.2em;
  padding:7px 12px;background:rgba(11,8,6,.6);border:1px solid rgba(201,162,74,.22);cursor:pointer;opacity:0;transition:opacity 1s}
#backBtn.show{display:block;opacity:.9}
#favBtn.on,#favListBtn.on{color:#e9cf7e;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) brightness(1.35)}
#favListBtn.on b svg{fill:#c9a24a}
#favPanel{position:fixed;inset:0;z-index:29;display:none;background:rgba(5,3,1,.85);
  align-items:center;justify-content:center}
#favPanel .box{max-height:76vh;overflow:auto;background:#161009;border:1px solid rgba(216,207,188,.4);
  padding:22px;color:#d8cfbc;font-family:serif;min-width:min(80vw,340px)}
#favPanel h2{font-size:14px;letter-spacing:.4em;text-indent:.4em;text-align:center;margin:0 0 16px;font-weight:normal}
#favPanel .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#favPanel .grid img{width:100%;border:1px solid rgba(216,207,188,.35);display:block;cursor:pointer}
#favPanel .empty{font-size:13px;letter-spacing:.2em;text-align:center;padding:18px 6px;color:#a99e88}
#favPanel .close{display:block;margin:18px auto 0;background:none;border:1px solid rgba(216,207,188,.4);
  color:#d8cfbc;padding:7px 26px;letter-spacing:.3em;text-indent:.3em;font-family:serif;cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ribbon"></div>
<canvas id="book"></canvas>
<div id="paperGlow"></div>
<div id="candle"></div>
<div id="shade"></div>
<div id="halo"></div>
<img id="candleImg" alt="" src="../assets/candle.png?b=20260904v23" onerror="this.style.display='none'"><div id="flameGlow"></div>
<div id="flameWrap"><div id="wick"></div><div id="flame"></div><div id="flameCore"></div></div>
<div id="veil"></div>
<canvas id="dust"></canvas>
<div id="cover"><div id="coverImg"></div><div id="coverVin"></div><div id="coverGlow"></div><img id="logoMark" src="../assets/logo-mark.png" alt=""></div>
<div id="dim"></div>
<div id="title"><div class="rule"></div><div class="main">名言集 1000枚</div><div class="rule"></div></div>
<div id="lidT" class="hidden"></div><div id="lidB" class="hidden"></div>
<div id="seen"></div>
<div id="backBtn">‹ 戻る</div>
<div id="favBtn"><b>♡</b><span>印</span></div>
<div id="favListBtn"><b><svg width="14" height="18" viewBox="0 0 14 18" fill="none" stroke="#c9a24a" stroke-width="1.3"><path d="M2 1h10v16l-5-4-5 4z"/></svg></b><span>栞</span></div>
<div id="setBtn"><b></b><span>音量</span></div>
<div id="favPanel"><div class="box"><h2>お気に入り</h2><div class="grid" id="favGrid"></div>
<div class="empty" id="favEmpty">まだ何も挟まれていない</div><button class="close" id="favClose">閉じる</button></div></div>
<div id="fade"></div>
<audio id="bgm" loop preload="auto" src="../assets/bgm.mp3"></audio>
<audio id="rain" loop preload="auto" src="../assets/rain.mp3"></audio>
<script>
(() => {
const N = 790, SRC = i => '../assets/pages/p' + (i + 1) + '.jpg';
// deck = いま本に綴じられているページ(実ページ番号の並び)。お気に入りモードで差し替わる
const ALL_PAGES = Array.from({ length: N }, (_, i) => i);
// 開くたびに並びをシャッフル(魔法の本)。お気に入りは実ページ番号で保存するので影響なし
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let deck = shuffled(ALL_PAGES);
const pg = k => imgs[deck[k]];
const cv = document.getElementById('book'), ctx = cv.getContext('2d');
let W, H, DPR, TRAVEL;
const EDGE = 8;
function layout() {
  const vw = innerWidth, vh = innerHeight;
  H = Math.min(vh * 0.72, vw * 0.92 * 4 / 3); W = H * 3 / 4;   // v22: 下のボタン列が本にかぶらない高さ
  DPR = Math.min(devicePixelRatio || 1, 1.75);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  TRAVEL = Math.max(180, Math.min(W * 1.05, vw * 0.72));
}
layout();
addEventListener('resize', () => { layout(); draw(); placeRibbon(false); });

// ---------- v16 共通の小道具 ----------
// 触覚: 対応端末だけ、指先に「コッ」と来る程度(Safari/iPhoneは未対応なので何も起きない)
function haptic(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
// 親(シェル)への合図
function post(type, extra) { if (!EMBED) return; try { parent.postMessage(Object.assign({ type }, extra || {}), '*'); } catch (e) {} }
// 栞の紐: 本の裏(ページの間)を通る。上から滑り込み、下から尻尾が出る
const ribbonEl = document.getElementById('ribbon');
let ribbonShown = false;
function placeRibbon(animate) {
  const r = cv.getBoundingClientRect();
  const tail = Math.round(Math.max(52, r.height * 0.11)), rh = Math.round(r.height * 0.96 + tail);
  ribbonEl.style.height = rh + 'px';
  ribbonEl.style.left = Math.round(r.left + r.width * 0.71) + 'px';
  const top = Math.round(r.top - tail);                              // 尻尾は上に出る(KEI 2026-09-04)
  if (animate) {
    ribbonEl.classList.remove('sway');
    ribbonEl.style.transition = 'none';
    ribbonEl.style.top = Math.round(r.top - rh - 6) + 'px';
    void ribbonEl.offsetHeight;
    ribbonEl.style.transition = '';
    ribbonEl.classList.add('show');
    requestAnimationFrame(() => { ribbonEl.style.top = top + 'px'; });
    setTimeout(() => ribbonEl.classList.add('sway'), 1200);
  } else {
    ribbonEl.style.transition = 'none'; ribbonEl.style.top = top + 'px'; void ribbonEl.offsetHeight; ribbonEl.style.transition = '';
  }
}
function showRibbon(animate) { if (ribbonShown && !animate) return; ribbonShown = true; placeRibbon(animate); if (!animate) { ribbonEl.classList.add('show', 'sway'); } }
function hideRibbon() { if (!ribbonShown) return; ribbonShown = false; ribbonEl.classList.remove('show', 'sway'); }

// ---- lazy image loading (cover shows instantly; pages arrive in the background) ----
const imgs = new Array(N); let backTex = null;
const loadImg = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
let index = 0, flip = null, anim = null;
// 2026-09-03: 数百枚対応。全部先読みせず「いま開いているページの前後だけ」を読み、めくるたびに先へ足していく(漫画アプリ式)
const AHEAD = 8, BEHIND = 2, MAX_PAR = 4;
const loading = new Set();
let _firstReady = null;
const pagesReady = new Promise(res => { _firstReady = res; });
function ensure(i, prio) {
  if (i < 0 || i >= N || imgs[i] || loading.has(i)) return;
  if (!prio && loading.size >= MAX_PAR) return;
  loading.add(i);
  loadImg(SRC(i)).then(im => {
    imgs[i] = im; loading.delete(i);
    const k = deck.indexOf(i);
    if (k >= index - 1 && k <= index + 1) draw();
    if (i === deck[0] || i === deck[index]) _firstReady();
    pump();
  });
}
function pump() {
  for (let d = 0; d <= AHEAD; d++) { const k = index + d; if (k >= 0 && k < deck.length) ensure(deck[k], d <= 1); }
  for (let d = 1; d <= BEHIND; d++) { const k = index - d; if (k >= 0) ensure(deck[k], false); }
}
pump();
setTimeout(() => { if (!imgs[deck[index]]) _firstReady(); }, 6000);   // 読めなくても暗いページを出して先へ進める
loadImg('../assets/backside.jpg').then(im => { backTex = im; });


// ---------- favorites(しおり) ----------
const favBtn = document.getElementById('favBtn');
const favListBtn = document.getElementById('favListBtn');
const favPanel = document.getElementById('favPanel');
const favGrid = document.getElementById('favGrid');
const favEmpty = document.getElementById('favEmpty');
let favs = [];
try { favs = JSON.parse(localStorage.getItem('bookexp-favs')) || []; } catch (e) {}
function saveFavs() { try { localStorage.setItem('bookexp-favs', JSON.stringify(favs)); } catch (e) {} }
const seenEl = document.getElementById('seen'); const seenSet = new Set();
function updateSeen() {
  if (deck[index] != null) seenSet.add(deck[index]);
  seenEl.innerHTML = '<b>' + seenSet.size + '</b>枚目';
}
function updateFavUI() {
  updateSeen();
  const bm = loadBookmark();
  const bmHere = !!(bm && bm.index === index && bm.deck[bm.index] === deck[index]);
  favListBtn.classList.toggle('on', bmHere);
  if (bmHere) showRibbon(false); else hideRibbon();
  const on = favs.includes(deck[index]);
  favBtn.querySelector('span').textContent = on ? '印あり' : '印'; favBtn.querySelector('b').textContent = on ? '♥' : '♡';
  favBtn.classList.toggle('on', on);
}

// ---------- book-like peel geometry ----------
// v16: 指のYもページ物理に入れる。掴んだ高さ fy(0=上端,1=下端)で巻き込み方が変わり、指の縦移動 dy で曲がり方が追従する
var grab = { fy: 0.30, dy: 0 };
function peel(t, pw, ph) {
  const fy = grab.fy, gdy = grab.dy;
  const sag = 1 - Math.min(1, Math.abs(fy - 0.5) * 2);          // 中央付近を掴むほど大きくたわむ
  const C = { x: pw, y: ph * fy };
  const P1 = { x: pw * (0.05 - sag * 0.22), y: ph * (fy + (0.5 - fy) * 1.6) + gdy * 0.45 };
  const P2 = { x: -pw * (1.7 + sag * 0.35),  y: ph * (fy - (0.5 - fy) * 0.4) + gdy * 0.7 };
  const u = 1 - t;
  const M = { x: u * u * C.x + 2 * t * u * P1.x + t * t * P2.x,
              y: u * u * C.y + 2 * t * u * P1.y + t * t * P2.y };
  let dx = M.x - C.x, dy = M.y - C.y;
  const len = Math.hypot(dx, dy) || 1;
  const n = { x: dx / len, y: dy / len };
  const mid = { x: (C.x + M.x) / 2, y: (C.y + M.y) / 2 };
  const k = mid.x * n.x + mid.y * n.y;

}

function clipPoly(poly, g, keepNeg) {

    const da = sd(a, g), db = sd(b, g);
    const ina = keepNeg ? da <= 0 : da >= 0, inb = keepNeg ? db <= 0 : db >= 0;
    if (ina) out.push(a);
    if (ina !== inb) {
      const f = da / (da - db);

    gr.addColorStop(0, (e.hot ? 'rgba(255,236,190,' : 'rgba(255,190,110,') + (al * 0.9).toFixed(3) + ')');

    gr.addColorStop(1, 'rgba(255,110,30,0)');
    dctx.fillStyle = gr;
    dctx.beginPath(); dctx.arc(e.x, e.y, rr * 5, 0, Math.PI * 2); dctx.fill();
    // 芯
    dctx.fillStyle = (e.hot ? 'rgba(255,246,220,' : 'rgba(255,200,130,') + Math.min(0.95, al * (e.hot ? 1.3 : 0.9)).toFixed(3) + ')';
    dctx.beginPath(); dctx.arc(e.x, e.y, rr * 0.55, 0, Math.PI * 2); dctx.fill();
  }
  dctx.restore();
  // 吸い込まれる時の光の粒(ワープ・集中線)
  if (warpOn) {
    if (warps.length < 150) for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, d = 20 + Math.random() * 60;
      warps.push({ a, d, sp: 1.5 + Math.random() * 4.5, w: 0.7 + Math.random() * 1.8, al: 0.2 + Math.random() * 0.5 });
    }
    const cx = dc.width / 2, cy = dc.height / 2;
    for (let i = warps.length - 1; i >= 0; i--) {
      const p = warps[i];
      p.sp *= 1.045; p.d += p.sp;
      const x1 = cx + Math.cos(p.a) * p.d, y1 = cy + Math.sin(p.a) * p.d;
      const x2 = cx + Math.cos(p.a) * (p.d + p.sp * 6), y2 = cy + Math.sin(p.a) * (p.d + p.sp * 6);
      if (p.d > Math.hypot(cx, cy) + 60) { warps.splice(i, 1); continue; }
      dctx.strokeStyle = 'rgba(255,230,180,' + p.al.toFixed(3) + ')';
      dctx.lineWidth = p.w;
      dctx.beginPath(); dctx.moveTo(x1, y1); dctx.lineTo(x2, y2); dctx.stroke();
    }
  } else if (warps.length) warps.length = 0;
  requestAnimationFrame(dustStep);
})(0);

// ---------- candle flicker (room + ぽわぽわ paper glow) ----------
const candle = document.getElementById('candle');
const paperGlow = document.getElementById('paperGlow');
const veil = document.getElementById('veil');
let veilTarget = 0;
veil.style.transition = 'opacity 1.4s ease';
const shade = document.getElementById('shade'), flame = document.getElementById('flame'), halo = document.getElementById('halo');
// v23: ロウソク画像(あれば点ける)。炎の位置は画像内の比率(FLAME_X/Y)で合わせる
const candleImg = document.getElementById('candleImg'), flameGlow = document.getElementById('flameGlow');
var candleOn = false; const FLAME_X = 0.43, FLAME_Y = 0.23;
candleImg.addEventListener('load', () => { candleOn = true; setTimeout(() => candleImg.classList.add('on'), 800); });
// 2026-09-03 KEI: ピカピカ→「ゆっくり滑らかに、ぼやーっと変わる」灯り。乱数の飛びをやめ、遅い正弦の重ね合わせ+ゆるい目標追従
var _fl = { t: 0, tgt: 0, cur: 0, next: 0, gust: 0 };   // var: 先に呼ばれる draw()/lampOverlay から参照されるため
function _smoothNoise(t) {
  return Math.sin(t * 0.61) * 0.5 + Math.sin(t * 1.37 + 1.3) * 0.3 + Math.sin(t * 0.23 + 2.1) * 0.2;
}
function gust(s) { _fl.gust = Math.min(1.2, _fl.gust + s); }
let _flPrev = performance.now();
(function flicker(now) {
  const dt = Math.min((now - _flPrev) / 1000, 0.1); _flPrev = now; _fl.t += dt;
  if (_fl.gust > 0.001) { _fl.gust *= Math.exp(-dt / 0.42); if (_fl.gust < 0.001) _fl.gust = 0; }
  // たまに(8〜20秒に1回)ゆっくり暗くなる「息」。目標値へ時定数~1.2秒で寄る
  if (_fl.t > _fl.next) { _fl.tgt = Math.random() < 0.45 ? -0.35 - Math.random() * 0.25 : 0; _fl.next = _fl.t + 8 + Math.random() * 12; }
  _fl.cur += (_fl.tgt - _fl.cur) * (1 - Math.exp(-dt / 1.2));
  if (_fl.tgt !== 0 && Math.abs(_fl.cur - _fl.tgt) < 0.03) _fl.tgt = 0;
  const n = _smoothNoise(_fl.t);                         // -1..1 ゆっくり
  const lvl = 0.95 + n * 0.05 + _fl.cur * 0.45;          // 全体の明るさ(v5: 常に強め)
  candle.style.opacity = lvl.toFixed(3);
  const dx = _smoothNoise(_fl.t * 0.8 + 5) * 0.9, dy = _smoothNoise(_fl.t * 0.7 + 9) * 0.6, sc = 1 + n * 0.02;
  shade.style.transform = 'translate(' + dx.toFixed(2) + '%,' + dy.toFixed(2) + '%) scale(' + sc.toFixed(3) + ')';
  shade.style.opacity = (0.86 - _fl.cur * 0.3).toFixed(3);
  const gj = _fl.gust * (0.5 + 0.5 * Math.sin(_fl.t * 41));
  halo.style.opacity = Math.min(1, 0.95 + n * 0.10 + _fl.cur * 0.4 + gj * 0.25).toFixed(3);
  // 炎そのもの(ゆっくり): 背の高さ・傾き・明るさを灯りと同期
  flame.style.transform = 'scaleY(' + (0.92 + n * 0.10 + _fl.cur * 0.25).toFixed(3) + ') scaleX(' + (0.96 + n * 0.05).toFixed(3) + ') skewX(' + (dx * 4).toFixed(1) + 'deg)';
  flame.style.opacity = (0.9 + n * 0.08 + _fl.cur * 0.2).toFixed(3);
  halo.style.transform = 'translate(' + (35 + dx).toFixed(1) + '%,' + (40 + dy).toFixed(1) + '%) scale(' + (1 + n * 0.03).toFixed(3) + ')';
  // v23: 炎のボヤボヤ(画像の炎の位置に重ねる)。紙の灯り・halo と同じ揺れ
  if (candleOn) {
    const r = candleImg.getBoundingClientRect();
    const fx = r.left + r.width * FLAME_X, fy = r.top + r.height * FLAME_Y;
    const fast = Math.sin(_fl.t * 9.1) * 0.5 + Math.sin(_fl.t * 13.7 + 1) * 0.3 + Math.sin(_fl.t * 23 + 2) * 0.2;
    flameGlow.style.left = (fx + fast * 2.5 + gj * 6).toFixed(1) + 'px'; flameGlow.style.top = (fy + fast * 1.5).toFixed(1) + 'px';
    flameGlow.style.opacity = Math.max(0, Math.min(1, 0.55 + n * 0.18 + _fl.cur * 0.35 + fast * 0.08 + gj * 0.3)).toFixed(3);
    flameGlow.style.transform = 'scale(' + (0.9 + n * 0.12 + fast * 0.06 + gj * 0.25).toFixed(3) + ',' + (1.0 + n * 0.16 + fast * 0.10 + gj * 0.3).toFixed(3) + ')';
  }
  if (glowBase > 0) {
    paperGlow.style.opacity = (glowBase * (0.95 + n * 0.20 + _fl.cur * 0.35)).toFixed(3);
    paperGlow.style.transform = 'translate(-50%,-50%) scale(' + (1 + n * 0.02).toFixed(3) + ')';
    const vt = _fl.cur < -0.15 ? 0.10 : 0.02;
    if (vt !== veilTarget) { veilTarget = vt; veil.style.opacity = vt.toFixed(3); }
  }
  if (lampLevel > 0.001 && !flip && (++_lampTick % 2 === 0 || _fl.gust > 0.01 || tilt.on)) draw();
  requestAnimationFrame(flicker);
})(performance.now());

// ---------- opening sequence: tap -> souls title -> zoom into the book -> pages ----------
const cover = document.getElementById('cover');
const title = document.getElementById('title');
const dim = document.getElementById('dim');
const lidT = document.getElementById('lidT');
const lidB = document.getElementById('lidB');
let opening = false;
requestAnimationFrame(() => { document.getElementById('fade').style.opacity = '0'; });
const ci = document.getElementById('coverImg');
// --- 表紙の疑似3D: 指でドラッグすると本を右から左から覗ける ---
let cp = null, tiltX = 0, tiltY = 0, springing = false;
function applyTilt() {
  ci.style.transform = 'rotateX(' + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg) scale(1.06)';
}
cover.addEventListener('pointerdown', e => {
  if (opening) return;
  cp = { x0: e.clientX, y0: e.clientY, moved: false };
  cover.setPointerCapture(e.pointerId);
});
cover.addEventListener('pointermove', e => {
  if (!cp || opening) return;
  const dx = e.clientX - cp.x0, dy = e.clientY - cp.y0;
  if (!cp.moved && Math.hypot(dx, dy) < 8) return;
  if (!cp.moved) { cp.moved = true; springing = false; ci.style.animation = 'none'; ci.style.transition = 'none'; }
  tiltY = Math.max(-14, Math.min(14, dx / innerWidth * 34));
  tiltX = Math.max(-12, Math.min(12, -dy / innerHeight * 30));
  applyTilt();
});
cover.addEventListener('pointerup', e => {
  if (!cp || opening) return;
  const wasTap = !cp.moved; cp = null;
  if (wasTap) { startOpening(); return; }
  // ゆっくり正面に戻る
  springing = true;
  ci.style.transition = 'transform 1s cubic-bezier(.2,.9,.3,1.1)';
  ci.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
  setTimeout(() => { if (springing && !opening) { ci.style.transition = ''; ci.style.transform = ''; ci.style.animation = ''; } }, 1050);
});
cover.addEventListener('pointercancel', () => { cp = null; });

// --- タップで開幕: タイトル → 100%→2000%の吸い込みズーム → 暗転 → ページ世界 ---
function startOpening() {
  if (opening) return; opening = true;
  ensureAudio(); thump();
  dim.style.opacity = '0.45';                            // the room sinks darker
  setTimeout(() => { title.classList.add('show'); }, 500);      // 名言集 1000枚 ボワーン
  setTimeout(() => { title.classList.add('hide'); }, 2600);     // and it dissolves
  setTimeout(() => {                                            // 本の中へ、徐々に加速して近づき、密着して真っ暗へ
    cover.classList.add('zooming');
    ci.style.animation = 'none'; ci.style.transition = 'none';
    const zt0 = performance.now(), zdur = 3100;
    (function zstep(now) {
      const k = Math.min(1, (now - zt0) / zdur);
      const e = Math.pow(k, 3.8);                               // ゆっくり→ぐわーっと一気に吸い込まれる
      const s = 1 + e * 19;                                     // 100% -> 2000%
      ci.style.transform = 'scale(' + s.toFixed(3) + ')';
      const br = k < 0.65 ? 0.82 : Math.max(0, 0.82 * (1 - (k - 0.65) / 0.32));
      ci.style.filter = 'brightness(' + br.toFixed(3) + ')';     // 最後は本に飲まれて完全な闇
      if (k < 1 && opening) requestAnimationFrame(zstep);
    })(zt0);
  }, 3300);
  setTimeout(() => { dim.style.transition = 'opacity 0.4s ease'; dim.style.opacity = '1'; }, 6100);
  setTimeout(() => {                                            // 真っ暗の中で場面が入れ替わる
    cover.remove(); title.remove();
    pagesReady.then(() => { draw(); });
    cv.classList.add('in');
    showFavButtons();
  }, 6600);
  setTimeout(() => {                                            // ぼっ。ろうそくが灯る
    rampGlow(0.45, 300);
    dim.style.transition = 'opacity 2.6s ease';                 // 闇が徐々に晴れて、見やすい明るさへ
    dim.style.opacity = '0';
  }, 7400);
  setTimeout(() => { rampGlow(0.55, 2200); }, 7800);
  setTimeout(() => { cv.classList.add('sway'); }, 10200);       // 手で持っているような微かな揺れ
}
// ろうそくの灯りをじわーっと目標値まで灯す
let glowRaf = null;
function rampGlow(target, ms) {
  if (glowRaf) cancelAnimationFrame(glowRaf);
  const from = glowBase, t0 = performance.now();
  (function gstep(now) {
    const k = Math.min(1, (now - t0) / ms);
    glowBase = from + (target - from) * (1 - Math.pow(1 - k, 2)); lampLevel = glowBase; draw();
    if (k < 1) glowRaf = requestAnimationFrame(gstep); else glowRaf = null;
  })(t0);
}

// ---- スタート画面から直行: #read=即めくり / #fav=お気に入りだけの本 (2D表紙シーンは飛ばす) ----
if (location.hash === '#fav' || location.hash === '#read' || location.hash === '#resume' || location.hash === '#fresh') {
  opening = true;
  cover.remove(); title.remove();
  cv.classList.add('in'); cv.classList.add('sway');
  rampGlow(1.0, EMBED ? 3600 : 900);    // 埋め込み時は暗い所から徐々に灯る(KEI 2026-09-04)
  pagesReady.then(() => { draw(); updateFavUI(); if (EMBED) { try { parent.postMessage({ type: 'reader-ready' }, '*'); } catch (e) {} }
    // 2026-09-03: 初回表示が暗いまま固まる(Chromeの合成キャッシュ)→ 少し後に layout+draw をやり直すと直る
    [300, 1200, 2600].forEach(ms => setTimeout(() => { dispatchEvent(new Event('resize')); }, ms));
  });
  showFavButtons();
  if (location.hash === '#fav') enterFavBook();
  // 2026-09-03 KEI: 栞を挟んであれば、普通に開いても(#read)その並び・そのページのまま固定。栞が無ければ開くたびランダム。
  // #fresh = 並びを新しくシャッフルし直し、栞は外す
  if (location.hash === '#fresh') { try { localStorage.removeItem('bookexp-bookmark'); } catch (e) {} }
  if (location.hash === '#resume' || location.hash === '#read') {
    const b = loadBookmark();
    if (b) { const ok = b.deck.every(n => n >= 0 && n < N); if (ok) { deck = b.deck; index = Math.min(b.index, deck.length - 1); favMode = !!b.fav; draw(); updateFavUI(); } }
  }
  uiWake();
}

// ---------- v16: 読んでいる間だけUIを消す ----------
// 2.5秒操作がなければ、ボタンと枚数を闇へ溶かす。残るのは本と書斎と光と雨だけ。画面の下側(または上端)に触れれば戻る
var uiTimer = null;
var uiJustWoke = 0;   // 消えていたUIを起こしたタップでは、栞/お気に入りは反応しない(誤操作防止)。戻る/設定は通す
function uiWake() {
  if (document.body.classList.contains('uihide')) uiJustWoke = performance.now();
  document.body.classList.remove('uihide');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => document.body.classList.add('uihide'), 2500);
}
document.addEventListener('pointerdown', e => {
  const y = e.clientY / innerHeight;
  if (y > 0.78 || y < 0.14) uiWake();
  else if (!document.body.classList.contains('uihide')) uiWake();     // 見えている間の操作は表示を延長するだけ
}, { passive: true });
[favBtn, favListBtn].forEach(el => el.addEventListener('click', uiWake));
[document.getElementById('setBtn'), document.getElementById('backBtn'), document.getElementById('favClose')].forEach(el => el.addEventListener('click', () => { ensureAudio(); uiClick(); }));

// ---------- v16: 本を閉じる儀式(シェルからの合図で、ページの世界が先に沈む) ----------
function closeRitual() {
  rustleStop(); cancelSettle();
  document.body.classList.add('uihide');
  cv.classList.remove('sway'); cv.classList.add('out');
  rampGlow(0, 1200);
  hideRibbon();
}
addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'reader-closing') closeRitual();
});

// ---------- v16: 端末の傾き(箔押し・インクの艶) ----------
let _tiltBound = false;
function listenTilt() {
  if (_tiltBound) return; _tiltBound = true;
  addEventListener('deviceorientation', ev => {
    if (ev.gamma == null || ev.beta == null) return;
    tilt.on = true;
    tilt.x = Math.max(-1, Math.min(1, ev.gamma / 35));
    tilt.y = Math.max(-1, Math.min(1, (ev.beta - 45) / 35));
  }, { passive: true });
}
try { if (!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')) listenTilt(); } catch (e) {}
})();
</script>
