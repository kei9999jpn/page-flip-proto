<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>異世界の叡智 — 書</title>
<style>
html,body{margin:0;height:100%;background:#0d0a07;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:7vh;text-align:center;color:#c9bda2;
  font-family:serif;font-size:15px;letter-spacing:.35em;opacity:0;transition:opacity 2s;
  pointer-events:none;text-shadow:0 0 12px #000}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.1s ease-in}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">本 に 触 れ る</div>
<div id="fade"></div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0a07);
scene.fog = new THREE.FogExp2(0x0d0a07, 1.4);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 10);
const CAM_R = 0.88;                 // 本からの距離
let camTheta = 0.35, camPhi = 1.02; // 方位角/仰角(やや俯瞰で全体を収める)
camera.position.set(0, 0.06, CAM_R);

// ---- 灯り: 蝋燭の暖色 + 芯のちらつき ----
scene.add(new THREE.AmbientLight(0x2a2018, 2.2));
const candle = new THREE.PointLight(0xffb45e, 5.2, 2.5, 2.0);
candle.position.set(0.28, 0.34, 0.30);
scene.add(candle);
const rim = new THREE.DirectionalLight(0x7a86a8, 0.9); // 月色の逆光
rim.position.set(-0.5, 0.4, -0.6);
scene.add(rim);

// ---- 本 ----
const pivot = new THREE.Group();
scene.add(pivot);
let book = null;
new GLTFLoader().load('../assets/book.glb', (g) => {
  book = g.scene;
  // モデルはY=高さ・+Z=表紙。立てて少し傾け、宙に浮かべる
  book.rotation.z = 0.06;
  pivot.add(book);
  document.getElementById('hint').style.opacity = 1;
});

// ---- 塵 ----
const dustGeo = new THREE.BufferGeometry();
const N = 220, pos = new Float32Array(N*3), spd = [];
for (let i = 0; i < N; i++) {
  pos[i*3]   = (Math.random()-0.5) * 1.4;
  pos[i*3+1] = (Math.random()-0.5) * 1.0;
  pos[i*3+2] = (Math.random()-0.5) * 1.4;
  spd.push(0.008 + Math.random()*0.02);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color:0xd8b878, size:0.0035, transparent:true, opacity:0.55, depthWrite:false}));
scene.add(dust);

// ---- 操作: ドラッグで回す(なければゆっくり自転) ----
let dragging = false, lastX = 0, lastY = 0, idleT = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; moved = 0; });
let moved = 0;
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  camTheta -= dx * 0.006;
  camPhi = Math.max(0.5, Math.min(2.2, camPhi - dy * 0.004));
  lastX = e.clientX; lastY = e.clientY; idleT = 0;
});
addEventListener('pointerup', e => {
  if (dragging && moved < 8 && book && !diving) dive(); // タップ=吸い込まれる
  dragging = false;
});

// ---- 吸い込まれ演出 → A案へ ----
let diving = false, diveT = 0;
function dive() {
  diving = true;
  document.getElementById('hint').style.opacity = 0;
  setTimeout(() => document.getElementById('fade').style.opacity = 1, 650);
  setTimeout(() => location.href = '../a/', 1750);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  idleT += dt;

  // 蝋燭のちらつき・本の呼吸するような浮遊
  candle.intensity = 5.2 + Math.sin(t*9.1)*0.7 + Math.sin(t*23.7)*0.4;
  if (book) {
    pivot.position.y = Math.sin(t*0.9) * 0.008;
    if (!dragging && idleT > 2.5 && !diving) camTheta += dt * 0.12; // 待つと自転
  }

  // 塵の漂い
  const p = dustGeo.attributes.position.array;
  for (let i = 0; i < N; i++) {
    p[i*3+1] += spd[i] * dt;
    if (p[i*3+1] > 0.55) p[i*3+1] = -0.55;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // カメラ
  if (diving) {
    diveT += dt;
    const k = Math.min(diveT / 1.6, 1);
    const e2 = k*k*(3-2*k); // smoothstep
    const r = CAM_R * (1 - e2) + 0.06 * e2;               // 表紙の目前まで
    const th = camTheta * (1 - e2);                        // 真上へ回り込み、表紙に落ちていく
    const ph = camPhi * (1 - e2) + 0.10 * e2;
    camera.position.set(r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph), r*Math.sin(ph)*Math.cos(th));
    camera.lookAt(0, 0.01, 0);
  } else {
    camera.position.set(CAM_R*Math.sin(camPhi)*Math.sin(camTheta), CAM_R*Math.cos(camPhi), CAM_R*Math.sin(camPhi)*Math.cos(camTheta));
    camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
