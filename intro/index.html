<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>異世界の叡智 — 書</title>
<style>
html,body{margin:0;height:100%;background:#0d0a07;overflow:hidden;font-family:serif}
#c{display:block;width:100%;height:100%;touch-action:none}
#logo{position:fixed;top:7vh;left:50%;transform:translateX(-50%);width:min(58vw,340px);
  opacity:0;transition:opacity 2.4s;pointer-events:none;filter:drop-shadow(0 0 18px rgba(0,0,0,.9))}
#menu{position:fixed;left:0;right:0;bottom:6vh;display:flex;flex-direction:column;gap:14px;
  align-items:center;opacity:0;transition:opacity 1.8s}
.btn{color:#d8cfbc;background:rgba(20,14,8,.55);border:1px solid rgba(216,207,188,.35);
  padding:11px 42px;font-size:15px;letter-spacing:.45em;text-indent:.45em;cursor:pointer;
  font-family:serif;backdrop-filter:blur(2px)}
.btn:active{background:rgba(216,207,188,.18)}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(5,3,1,.72)}
#panel .box{background:#161009;border:1px solid rgba(216,207,188,.4);color:#d8cfbc;
  padding:30px 34px;min-width:min(78vw,320px)}
#panel h2{font-size:15px;letter-spacing:.4em;margin:0 0 22px;font-weight:normal;text-align:center}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:15px 0;font-size:14px;letter-spacing:.15em}
#panel input[type=range]{width:110px;accent-color:#c9bda2}
#panel input[type=checkbox]{accent-color:#c9bda2;transform:scale(1.2)}
#closeBtn{display:block;margin:26px auto 0;background:none;border:1px solid rgba(216,207,188,.4);
  color:#d8cfbc;padding:8px 30px;letter-spacing:.35em;text-indent:.35em;font-family:serif;cursor:pointer}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.1s ease-in}
#burst{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .55s ease;
  background:radial-gradient(circle at 50% 52%,rgba(255,238,200,.95) 0%,rgba(255,210,130,.55) 30%,transparent 68%)}
#readTitle{position:fixed;left:0;right:0;top:37%;text-align:center;pointer-events:none;
  font-family:serif;color:#e9dfc8;opacity:0;filter:blur(14px);transition:opacity 1.2s ease,filter 1.2s ease}
#readTitle .main{font-size:min(9vw,56px);font-weight:600;letter-spacing:.24em;text-indent:.24em;white-space:nowrap;
  text-shadow:0 0 22px rgba(233,215,170,.4),0 2px 12px rgba(0,0,0,.9)}
#readTitle .rule{width:min(56vw,330px);height:1px;margin:13px auto;
  background:linear-gradient(90deg,transparent,rgba(233,223,200,.75),transparent)}
#readTitle.show{opacity:1;filter:blur(0)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="logo" src="../assets/logo-white.png" alt="">
<div id="menu">
  <button class="btn" id="btnRead">名言を見る</button>
  <button class="btn" id="btnFav">お気に入り</button>
  <button class="btn" id="btnSet">設　定</button>
</div>
<div id="panel"><div class="box">
  <h2>設定</h2>
  <label>BGM <input type="checkbox" id="sBgm"></label>
  <label>雨の音 <input type="checkbox" id="sRain"></label>
  <label>虫の声 <input type="checkbox" id="sInsects"></label>
  <label>環境音の大きさ <input type="range" id="sAmb" min="0" max="1" step="0.05"></label>
  <label>めくり音の大きさ <input type="range" id="sFlip" min="0" max="1.5" step="0.05"></label>
  <button id="closeBtn">閉じる</button>
</div></div>
<div id="burst"></div>
<div id="readTitle"><div class="rule"></div><div class="main">名言集 1000枚</div><div class="rule"></div></div>
<div id="fade"></div>
<audio id="bgm" loop preload="auto" src="../assets/bgm.mp3"></audio>
<audio id="rain" loop preload="auto" src="../assets/rain.mp3"></audio>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- 設定(共有: a/ 側も同じキーを読む) ----------
const DEFAULTS = { bgm:true, rain:true, insects:true, amb:0.6, flip:1.0 };
let S = DEFAULTS;
try { S = { ...DEFAULTS, ...(JSON.parse(localStorage.getItem('bookexp-settings')) || {}) }; } catch(e){}
function saveS(){ try { localStorage.setItem('bookexp-settings', JSON.stringify(S)); } catch(e){} applyAudio(); }
const $ = id => document.getElementById(id);
$('sBgm').checked = S.bgm; $('sRain').checked = S.rain; $('sInsects').checked = S.insects;
$('sAmb').value = S.amb; $('sFlip').value = S.flip;
$('sBgm').onchange = e => { S.bgm = e.target.checked; saveS(); };
$('sRain').onchange = e => { S.rain = e.target.checked; saveS(); };
$('sInsects').onchange = e => { S.insects = e.target.checked; saveS(); };
$('sAmb').oninput = e => { S.amb = +e.target.value; saveS(); };
$('sFlip').oninput = e => { S.flip = +e.target.value; saveS(); };
$('btnSet').onclick = () => { $('panel').style.display = 'flex'; };
$('closeBtn').onclick = () => { $('panel').style.display = 'none'; };

// ---------- 音 ----------
const bgm = $('bgm'), rain = $('rain');
let ac = null, cricketGain = null, audioOn = false;
function startCrickets() {
  if (!ac || cricketGain) return;
  cricketGain = ac.createGain(); cricketGain.connect(ac.destination);
  (function loop(){
    if (S.insects && audioOn) {
      const t0 = ac.currentTime + 0.05, n = 3 + Math.floor(Math.random()*3);
      for (let i = 0; i < n; i++) {
        const t = t0 + i * 0.07;
        const o = ac.createOscillator(); o.type = 'sine';
        o.frequency.value = 4100 + Math.random()*400;
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.05 * S.amb, t + 0.012);
        g.gain.linearRampToValueAtTime(0, t + 0.045);
        o.connect(g); g.connect(cricketGain); o.start(t); o.stop(t + 0.06);
      }
    }
    setTimeout(loop, 900 + Math.random()*2200);
  })();
}
function applyAudio() {
  if (!audioOn) return;
  bgm.volume = S.bgm ? 0.22 : 0; if (S.bgm && bgm.paused) bgm.play().catch(()=>{});
  rain.volume = S.rain ? 0.34 * S.amb : 0; if (S.rain && rain.paused) rain.play().catch(()=>{});
}
function ensureAudio() {
  if (audioOn) return;
  audioOn = true;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  startCrickets(); applyAudio();
}
addEventListener('pointerdown', ensureAudio, { once:false });

// ---------- three.js ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0a07);
scene.fog = new THREE.FogExp2(0x0d0a07, 1.4);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 10);
const CAM_R = 0.88;
let camTheta = 0.35, camPhi = 1.02;

scene.add(new THREE.AmbientLight(0x2a2018, 2.2));
const candle = new THREE.PointLight(0xffb45e, 5.2, 2.5, 2.0);
candle.position.set(0.28, 0.34, 0.30);
scene.add(candle);
const rimL = new THREE.DirectionalLight(0x7a86a8, 0.9);
rimL.position.set(-0.5, 0.4, -0.6);
scene.add(rimL);

const pivot = new THREE.Group();
scene.add(pivot);
let book = null, hinge = null;
new GLTFLoader().load('../assets/book.glb', (g) => {
  book = g.scene;
  book.rotation.z = 0.06;
  pivot.add(book);
  // 表紙をヒンジ(背側の縁)にぶら下げ直して開閉可能に
  const cover = book.getObjectByName('Cover_Front');
  if (cover) {
    const bb = new THREE.Box3().setFromObject(cover);
    hinge = new THREE.Group();
    hinge.position.set(bb.min.x, (bb.min.y + bb.max.y) / 2, 0);
    book.add(hinge);
    hinge.attach(cover);
  }
  $('logo').style.opacity = 1;
  $('menu').style.opacity = 1;
});

// 塵
const dustGeo = new THREE.BufferGeometry();
const N = 220, pos = new Float32Array(N*3), spd = [];
for (let i = 0; i < N; i++) {
  pos[i*3] = (Math.random()-0.5)*1.4; pos[i*3+1] = (Math.random()-0.5)*1.0; pos[i*3+2] = (Math.random()-0.5)*1.4;
  spd.push(0.008 + Math.random()*0.02);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color:0xd8b878, size:0.0035, transparent:true, opacity:0.55, depthWrite:false})));

// ドラッグで回す
let dragging = false, lastX = 0, lastY = 0, idleT = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  camTheta -= (e.clientX - lastX) * 0.006;
  camPhi = Math.max(0.4, Math.min(2.2, camPhi - (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY; idleT = 0;
});
addEventListener('pointerup', () => { dragging = false; });

// ---------- 演出: 表紙が開く → 吸い込まれ → 遷移 ----------
let opening = false, openT = 0, diving = false, diveT = 0, dest = '../a/#read';
function beginRead(to) {
  if (opening || diving) return;
  ensureAudio(); dest = to;
  $('menu').style.transition = 'opacity .5s'; $('logo').style.transition = 'opacity .5s';
  $('menu').style.opacity = 0; $('logo').style.opacity = 0;
  // 「名言集 1000枚」がボワーッと浮かぶ → 本がパカッ → 光があふれて吸い込まれる
  $('readTitle').classList.add('show');
  setTimeout(() => { $('readTitle').classList.remove('show'); }, 2100);
  setTimeout(() => { opening = true; }, 1400);
  setTimeout(() => { diving = true; }, 2000);
  setTimeout(() => { $('burst').style.opacity = 1; }, 2450);
  setTimeout(() => { $('fade').style.opacity = 1; }, 3050);
  setTimeout(() => location.href = dest, 4100);
}
$('btnRead').onclick = () => beginRead('../a/#read');
$('btnFav').onclick = () => beginRead('../a/#fav');
// 本そのものをタップしても始まる
let downXY = null;
canvas.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downXY) return;
  const d = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (d < 8 && book) beginRead('../a/#read');
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  idleT += dt;
  candle.intensity = 5.2 + Math.sin(t*9.1)*0.7 + Math.sin(t*23.7)*0.4;
  if (book) {
    pivot.position.y = Math.sin(t*0.9) * 0.008;
    if (!dragging && idleT > 2.5 && !opening && !diving) camTheta += dt * 0.12;
  }
  if (opening && hinge) {
    openT = Math.min(openT + dt / 1.1, 1);
    const k = openT*openT*(3-2*openT);
    hinge.rotation.z = k * 2.5;   // 表紙がバサッと開く
  }
  const p = dustGeo.attributes.position.array;
  for (let i = 0; i < N; i++) { p[i*3+1] += spd[i]*dt; if (p[i*3+1] > 0.55) p[i*3+1] = -0.55; }
  dustGeo.attributes.position.needsUpdate = true;

  if (diving) {
    diveT += dt;
    const k = Math.min(diveT / 1.6, 1), e2 = k*k*(3-2*k);
    const r = CAM_R * (1-e2) + 0.06 * e2;
    const th = camTheta * (1-e2);
    const ph = camPhi * (1-e2) + 0.10 * e2;
    camera.position.set(r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph), r*Math.sin(ph)*Math.cos(th));
    camera.lookAt(0, 0.01, 0);
  } else {
    camera.position.set(CAM_R*Math.sin(camPhi)*Math.sin(camTheta), CAM_R*Math.cos(camPhi), CAM_R*Math.sin(camPhi)*Math.cos(camTheta));
    camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
